<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>99 Names of Allah — Noor-ul-Iman</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="page-header">
  <h1 style="display:flex; align-items:center; justify-content:center; gap:0.75rem;">
    <i data-icon="sparkle" data-size="36"></i>
    <span>Asma-ul-Husna</span>
  </h1>
  <p>The 99 Beautiful Names of Allah</p>
</div>

<div class="container">
  <div class="search-bar">
    <input type="text" class="search-input" id="namesSearch" placeholder="Search by name, meaning, or number...">
  </div>

  <div style="text-align:center; padding:2.5rem 2rem; background:var(--gradient-night); color:white; border-radius:var(--radius-lg); margin-bottom:2rem; position:relative; overflow:hidden;">
    <div class="geometric-overlay" style="opacity:0.1;"></div>
    <div style="position:relative; z-index:1;">
      <div class="arabic" style="font-size:2rem; margin-bottom:1rem; background:var(--gradient-gold); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;">وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا</div>
      <p style="opacity:0.95; font-style:italic;">"And to Allah belong the best names, so invoke Him by them." — Quran 7:180</p>
    </div>
  </div>

  <div class="names-grid" id="namesGrid"></div>
</div>

<div id="footer-mount"></div>

<script src="../js/icons.js"></script>
<script src="../data/azan-dua.js"></script>
<script src="../js/app.js"></script>
<script src="../js/azan.js"></script>
<script src="../data/names.js"></script>
<script src="../js/names.js"></script>
<script src="../js/layout.js"></script>
</body>
</html>
