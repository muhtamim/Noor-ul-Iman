<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Tasbih — Noor-ul-Iman</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="page-header">
  <h1 style="display:flex; align-items:center; justify-content:center; gap:0.75rem;">
    <i data-icon="beads" data-size="36"></i>
    <span>Digital Tasbih</span>
  </h1>
  <p>Count your dhikr with ease</p>
</div>

<div class="container">
  <div class="tasbih-container">
    <div class="tasbih-display">
      <div class="tasbih-dhikr" id="dhikrArabic">سُبْحَانَ ٱللَّٰهِ</div>
      <div class="tasbih-translation" id="dhikrTrans">SubhanAllah — Glory be to Allah</div>

      <button class="tasbih-circle" id="tasbihBtn">
        <span id="tasbihCount">0</span>
      </button>

      <div class="tasbih-target" id="tasbihTarget">Target: 33 • Total: 0</div>

      <div class="tasbih-controls">
        <button class="btn btn-outline" onclick="resetCount()">
          <i data-icon="refresh" data-size="16"></i>
          <span>Reset Count</span>
        </button>
        <button class="btn btn-outline" onclick="resetTotal()">
          <i data-icon="trash" data-size="16"></i>
          <span>Reset All</span>
        </button>
      </div>
    </div>

    <h3 style="text-align:center; margin-top:2rem; color:var(--primary); font-weight:800; letter-spacing:-0.02em;">Select Dhikr</h3>
    <div class="dhikr-selector" id="dhikrSelector"></div>

    <div style="background:linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05)); border-left:4px solid var(--gold); padding:1.25rem; border-radius:var(--radius-sm); margin-top:2rem;">
      <div style="display:flex; align-items:center; gap:0.5rem;">
        <i data-icon="lightning" data-size="18" style="color:var(--gold-dark);"></i>
        <strong>Tip:</strong>
        <span style="color:var(--text-muted);">Tap the circle or press Space/Enter to count. Your count is saved automatically.</span>
      </div>
    </div>
  </div>
</div>

<div id="footer-mount"></div>

<script src="../js/icons.js"></script>
<script src="../data/azan-dua.js"></script>
<script src="../js/app.js"></script>
<script src="../js/azan.js"></script>
<script src="../js/tasbih.js"></script>
<script src="../js/layout.js"></script>
</body>
</html>
