<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holy Quran — Noor-ul-Iman</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

<div id="navbar-mount"></div>

<div class="page-header">
  <h1 style="display:flex; align-items:center; justify-content:center; gap:0.75rem;">
    <i data-icon="book" data-size="36"></i>
    <span>Holy Quran</span>
  </h1>
  <p>114 Surahs • 26+ translation languages • Audio recitation by 10 reciters • Tafsir</p>
</div>

<div class="container">
  <div id="surahListView">

    <!-- Global Language + Reciter Settings (prominent) -->
    <div class="quran-global-settings">
      <div class="quran-settings-header">
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <i data-icon="globe" data-size="20" style="color:var(--primary);"></i>
          <strong style="font-size:1.05rem;">Your Reading Preferences</strong>
        </div>
        <span style="font-size:0.8rem; color:var(--text-muted);">Saved automatically</span>
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:0.75rem;">
        <div>
          <label style="display:block; font-size:0.8rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.4rem;">🌐 Translation Language</label>
          <select id="globalLanguageSelect" class="quran-select" onchange="setGlobalLanguage(this.value)"></select>
        </div>
        <div>
          <label style="display:block; font-size:0.8rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.4rem;">🎤 Audio Reciter</label>
          <select id="globalReciterSelect" class="quran-select" onchange="setGlobalReciter(this.value)"></select>
        </div>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" class="search-input" id="surahSearch" placeholder="🔍 Search by surah name, number, or any keyword in 6,236 verses...">
    </div>
    <div class="surah-list" id="surahList">
      <div class="spinner"></div>
    </div>
  </div>

  <div id="surahDetail" class="surah-detail"></div>
</div>

<div id="footer-mount"></div>

<script src="../js/icons.js"></script>
<script src="../data/translations.js"></script>
<script src="../data/azan-dua.js"></script>
<script src="../js/app.js"></script>
<script src="../js/azan.js"></script>
<script src="../js/quran.js"></script>
<script src="../js/layout.js"></script>
</body>
</html>
